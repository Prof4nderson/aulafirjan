# Config da Porta do Servidor Tomcat embutido
server.port=8080

# Config da Conexao com o Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bdfirjan
spring.datasource.username=postgres
spring.datasource.password=123456

# Configuracoes do Hibernate / JPA
# update: Atualiza a estrutura da tabela sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update

# Dialeto do Banco de Dados
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar as instrucoes SQL executadas no console (excelente para didatica em sala)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true